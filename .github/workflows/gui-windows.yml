name: GUI · Windows build

on:
  workflow_dispatch:
  push:
    tags:
      - "gui-v*"

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: gui
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Toolchain
        run: flutter --version

      # The repo only carries pubspec + lib/. Regenerate the windows/ runner
      # scaffold with `flutter create`, keeping our own sources.
      - name: Generate windows/ scaffold
        run: |
          set -e
          mkdir -p .stash
          mv lib pubspec.yaml analysis_options.yaml .stash/
          flutter create --platforms=windows --project-name ocforge_gui --org com.ocforge --overwrite .
          rm -rf lib pubspec.yaml analysis_options.yaml test
          mv .stash/lib .stash/pubspec.yaml .stash/analysis_options.yaml .
          rmdir .stash
          test -f windows/CMakeLists.txt

      - name: Enable desktop + fetch deps
        run: |
          flutter config --enable-windows-desktop
          flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release
        run: flutter build windows --release

      - name: Package
        run: |
          set -e
          REL=build/windows/x64/runner/Release
          [ -d "$REL" ] || REL=build/windows/runner/Release
          echo "release dir: $REL"
          ls -la "$REL"
          ( cd "$REL" && 7z a -tzip "$GITHUB_WORKSPACE/OCForge-GUI-windows-x64.zip" ./* )
          echo "REL=$REL" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: OCForge-GUI-windows-x64
          path: gui/${{ env.REL }}/**
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: OCForge-GUI-windows-x64.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
