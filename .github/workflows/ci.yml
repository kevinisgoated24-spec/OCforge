name: CI

# Runs on every push to master or beta, and on PRs, unlike gui-build.yml
# (which only builds on a workflow_dispatch or a gui-v*/gui-beta-v* tag).
# With more than one person pushing directly to these branches, this is
# what actually catches a broken commit before someone notices the hard way.

on:
  push:
    branches: [master, beta]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # The floor pyproject.toml declares (requires-python >=3.11) --
          # catches anything that only happens to work on a newer interpreter.
          python-version: "3.11"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check ocforge tests

      - name: Pytest
        run: pytest -q

  # The only real Macs this project gets. Nobody on the team has one, so the
  # macOS probe/ACPI code is otherwise only ever run against synthetic
  # fixtures. Intel runner: probe + IORegistry ACPI dump must actually work.
  # Apple Silicon runner: probe must refuse cleanly and point at --spec.
  macos:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Pytest
        run: pytest -q

      - name: Real-host probe
        shell: bash
        run: |
          set -u
          if [ "$(uname -m)" = "arm64" ]; then
            if python -m ocforge probe 2>err.txt; then
              echo "::error::probe should refuse an Apple Silicon host"; exit 1
            fi
            cat err.txt
            grep -q "Apple Silicon" err.txt
          else
            python -m ocforge probe
            python -m ocforge probe --save host.json && cat host.json
          fi

      - name: Real-host ACPI dump (Intel only)
        if: runner.arch == 'X64'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from ocforge.probe import acpi_dump
          assert acpi_dump.can_dump(), "ioreg reported no ACPI tables"
          out = acpi_dump.dump_tables(Path("acpi-out"))
          files = sorted(p.name for p in out.iterdir())
          print(files)
          assert (out / "DSDT.aml").read_bytes()[:4] == b"DSDT"
          PY

      - name: IORegistry ACPI diagnostics
        if: failure() && runner.arch == 'X64'
        shell: bash
        run: |
          set +e
          echo "== platform expert classes"; ioreg -l -w0 -d 2 | grep -E "^\+-o|class" | head -20
          echo "== who has 'ACPI Tables'"; ioreg -l -w0 | grep -n "ACPI Tables" | cut -c1-300 | head
          echo "== -a -r -c AppleACPIPlatformExpert -d 1"; ioreg -a -r -c AppleACPIPlatformExpert -d 1 | head -c 3000
          echo; echo "== IOACPIPlane"; ioreg -p IOACPIPlane -w0 | head -20
          echo "== acpi node keys"; ioreg -a -r -n acpi -d 1 | grep "<key>" | head -40
          system_profiler SPHardwareDataType | head -20

  gui-analyze:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gui
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Linux build deps
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Only pubspec + lib/ are tracked — regenerate the platform scaffold,
      # same as gui-build.yml. This job only analyzes, it never packages a
      # release build.
      - name: Generate linux/ scaffold
        run: |
          set -e
          mkdir -p .stash
          mv lib pubspec.yaml analysis_options.yaml .stash/
          flutter create --platforms=linux --project-name ocforge_gui --org com.ocforge --overwrite .
          rm -rf lib pubspec.yaml analysis_options.yaml test
          mv .stash/lib .stash/pubspec.yaml .stash/analysis_options.yaml .
          rmdir .stash

      - name: Deps
        run: |
          flutter config --enable-linux-desktop
          flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
